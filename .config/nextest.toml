# Tune nextest concurrency so heavy multi-process GUI smoke and dual-restic
# integration suites do not saturate all 20 CPU threads or exhaust workstation RAM.

[profile.default]
# Cap overall concurrency below physical core count so the IDE, desktop session,
# and test child processes (Qt offscreen, daemon, restic) stay responsive.
test-threads = 8

[test-groups.gui-smoke]
max-threads = 2

[test-groups.heavy-integration]
max-threads = 4

[[profile.default.overrides]]
filter = "binary(m0_s04_kirigami_listmodel) | binary(m0_s06_qml_smoke) | binary(m0_s09_i18n) | binary(m0_s11_gui_basics) | binary(m1_gui_smoke) | binary(m2_gui_smoke) | binary(m3_gui_smoke)"
test-group = "gui-smoke"

[[profile.default.overrides]]
filter = "binary(m0_s02_bootstrap) | binary(m0_s07_checks) | binary(m0_s08_checks) | binary(m0_s10_checks) | binary(m0_s11_checks) | binary(m1_s05_secrets) | binary(m1_s06_destination) | binary(m1_s07_backup) | binary(m1_s09_dbus) | binary(m1_s10_cancel) | binary(m1_s11_tray_notify) | binary(m1_s12_autostart) | binary(m1_s23_availability) | binary(m2_s01_s03_excludes) | binary(m2_s04_dry_run) | binary(m2_s05_retention) | binary(m2_s09_s10_mount_nested) | binary(m2_integration) | binary(m3_s03_conditions) | binary(m3_s04_unreachable) | binary(m3_s04_exit_codes) | binary(m3_s04_s05_s06_restic) | binary(m3_s05_queue_maintenance) | binary(m3_s06_stale_locks) | binary(m3_s07_pause) | binary(m3_s08_monitoring) | binary(m3_s09_sleep) | binary(m3_s10_catchup) | binary(m3_s11_binary_watch) | binary(m3_s12_jobview) | binary(m3_s13_source_check) | binary(m3_s14_editors) | binary(m3_review_regressions)"
test-group = "heavy-integration"

[profile.ci]
test-threads = "num-cpus"
