# Tune nextest concurrency so heavy multi-process GUI smoke and dual-restic
# integration suites do not saturate all 20 CPU threads or exhaust workstation RAM.

[profile.default]
# Cap overall concurrency below physical core count so the IDE, desktop session,
# and test child processes (Qt offscreen, daemon, restic) stay responsive.
test-threads = 8

[test-groups.gui-smoke]
max-threads = 2

[test-groups.heavy-integration]
max-threads = 4

[[profile.default.overrides]]
filter = "binary(m1_gui_smoke) | binary(m2_gui_smoke) | binary(m3_gui_smoke) | binary(m3_gui_idle_polling)"
test-group = "gui-smoke"

[[profile.default.overrides]]
filter = "package(kestic-test-support) | binary(m0_s02_bootstrap) | binary(m1_s05_secrets) | binary(m1_s06_destination) | binary(m1_s07_backup) | binary(m1_s09_dbus) | binary(m1_s10_cancel) | binary(m1_s11_tray_notify) | binary(m1_s12_autostart) | binary(m1_s23_availability) | binary(m2_s01_s03_excludes) | binary(m2_s04_dry_run) | binary(m2_s05_retention) | binary(m2_s09_s10_mount_nested) | binary(m2_integration) | binary(m3_s03_conditions) | binary(m3_s04_unreachable) | binary(m3_s04_exit_codes) | binary(m3_s04_s05_s06_restic) | binary(m3_s05_queue_maintenance) | binary(m3_s06_stale_locks) | binary(m3_s07_pause) | binary(m3_s08_monitoring) | binary(m3_s09_sleep) | binary(m3_s10_catchup) | binary(m3_s11_binary_watch) | binary(m3_s12_jobview) | binary(m3_s13_source_check) | binary(m3_s14_editors) | binary(m3_daemon_regressions) | binary(m3_tray_lock_order) | binary(m3_jobview_cancel_watch)"
test-group = "heavy-integration"

# Binaries with the longest tests start first, so that no single long test
# runs alone at the end: GUI smoke tests walk every page in two languages,
# m3_s04_unreachable waits for a whole clock minute, m3_tray_lock_order works
# through 200 000 progress lines in an unoptimized build. Names follow the
# files in */tests/; a renamed file only loses the priority.
[[profile.default.overrides]]
filter = "binary(~_gui_smoke) | binary(m3_s04_unreachable) | binary(m3_tray_lock_order)"
priority = 50

[profile.ci]
test-threads = "num-cpus"
# Run every test even after a failure, so one CI run shows all failing tests.
fail-fast = false
