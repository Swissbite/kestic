[package]
name = "kestic-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
description = "Native KDE Plasma backup manager powered by restic"

[[bin]]
name = "kestic"
path = "src/main.rs"

[features]
# Offscreen QML smoke scenes, synthetic input and `--simulate-status` for tests;
# never enabled for the .deb.
test-harness = []

[dependencies]
kestic-core = { path = "../core" }
kestic-i18n = { path = "../i18n" }
kestic-daemon = { path = "../daemon" }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
cxx-qt-lib-extras = { workspace = true }
cxx-kde-frameworks = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
zbus = { workspace = true }

[build-dependencies]
cxx-qt-build = { workspace = true }

[package.metadata.deb]
name = "kestic"
section = "utils"
priority = "optional"
maintainer = "David Däster <david@daester.net>"
copyright = "2026 David Däster <david@daester.net>"
license-file = ["../LICENSES/GPL-3.0-or-later.txt", "0"]
extended-description = "Kestic is a native KDE Plasma desktop application that makes restic backups easy while preserving full restic configuration power."
depends = "$auto, qml6-module-org-kde-kirigami (>= 6.24), qml6-module-org-kde-kirigamiaddons-datetime (>= 1.11), qml6-module-org-kde-kirigamiaddons-tableview (>= 1.11)"
recommends = "restic (>= 0.18.0)"
suggests = "rclone, openssh-client"
assets = [
    ["target/release/kestic", "usr/bin/kestic", "755"],
    ["../packaging/net.daester.Kestic.desktop", "usr/share/applications/net.daester.Kestic.desktop", "644"],
    ["../packaging/net.daester.Kestic.daemon.desktop", "etc/xdg/autostart/net.daester.Kestic.daemon.desktop", "644"],
    ["../packaging/kestic.notifyrc", "usr/share/knotifications6/kestic.notifyrc", "644"],
    ["../packaging/icons/hicolor/scalable/apps/kestic.svg", "usr/share/icons/hicolor/scalable/apps/kestic.svg", "644"],
    ["../packaging/icons/hicolor/scalable/status/kestic-symbolic.svg", "usr/share/icons/hicolor/scalable/status/kestic-symbolic.svg", "644"],
    ["target/release/locale/de/LC_MESSAGES/kestic.mo", "usr/share/locale/de/LC_MESSAGES/kestic.mo", "644"],
]

[lints]
workspace = true
