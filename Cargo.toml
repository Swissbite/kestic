[workspace]
resolver = "2"
members = [
    "core",
    "i18n",
    "daemon",
    "gui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["David Däster <david@daester.net>"]
rust-version = "1.85"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"

[workspace.dependencies]
cxx = "1.0"
cxx-qt = "=0.10.0"
cxx-qt-lib = { version = "=0.10.0", features = ["qt_full"] }
cxx-qt-lib-extras = "=0.10.0"
cxx-qt-build = "=0.10.0"
cxx-kde-frameworks = { git = "https://invent.kde.org/libraries/cxx-kde-frameworks.git", rev = "5c51af42ad078feb89e4b7e590da9e3eab9e4d6d" }
jiff = "1.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
zbus = "6.3.0"
