[workspace]
resolver = "2"
members = [
    "build-stamp",
    "core",
    "i18n",
    "daemon",
    "gui",
    "test-support",
]

# Versions come from Git tags (build-stamp/src/version.rs); this one only satisfies Cargo.
[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["David Däster <david@daester.net>"]
rust-version = "1.100"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_possible_truncation = "warn"
map_unwrap_or = "warn"
duration_suboptimal_units = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
cxx-qt-lib-extras = "0.10.0"
cxx-qt-build = "0.10.0"
cxx-kde-frameworks = { git = "https://invent.kde.org/libraries/cxx-kde-frameworks.git", rev = "1d2c1abc84d5643b3f8baf8aa73db9d6aa47b252" }
jiff = "1.0"
ksni = { version = "0.3.7", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
zbus = "6.3.0"

# Line tables keep file:line in backtraces and panics of our own crates; dependencies, including
# the C++ code they compile, carry no debug info. Full debug info makes every test binary about
# three times as large and the target directory grow by gigabytes. For a debugger session with
# variables of our own crates: CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Test fixtures decrypt restic keys with restic's full scrypt parameters once per test run;
# unoptimized, that alone takes seconds per restic version.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# The restic download tests unpack (and the release mock packs) archives of restic's real size.
[profile.dev.package.libbz2-rs-sys]
opt-level = 3
