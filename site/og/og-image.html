<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 400; src: url("../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-400-normal.woff2"); }
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 800; src: url("../node_modules/@fontsource/schibsted-grotesk/files/schibsted-grotesk-latin-800-normal.woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    background: #f3f1ec; color: #17191b;
    font-family: "Schibsted Grotesk", sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 82px;
  }
  .icon { width: 300px; height: 300px; flex: none; }
  .wordmark { margin: 0; font-size: 158px; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
  .wordmark .dot { display: inline-block; width: 38px; height: 38px; margin-left: 6px; background: #d52b1e; }
  .tagline { margin: 34px 0 0; font-size: 40px; line-height: 1.32; color: #43454a; }
  .tagline code { font-family: "IBM Plex Mono", monospace; font-weight: 500; color: #17191b; font-size: 0.97em; }
</style>
</head>
<body>
  <img class="icon" src="../../packaging/icons/hicolor/scalable/apps/kestic.svg" alt="">
  <div>
    <p class="wordmark">kestic<span class="dot"></span></p>
    <p class="tagline">A KDE Plasma desktop app<br>for easy backups with <code>restic</code>.</p>
  </div>
</body>
</html>
