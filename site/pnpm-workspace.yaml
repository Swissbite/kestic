# Supply-chain hardening for the site toolchain.
# A freshly published version is only resolved after one day.
minimumReleaseAge: 1440

# The site uses plain <img> tags and no image optimisation, so Astro's optional
# image service is not installed (it would pull in native libvips binaries).
ignoredOptionalDependencies:
  - sharp
