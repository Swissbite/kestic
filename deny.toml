[graph]
all-features = true

[advisories]
# cargo-deny 0.22 checks unmaintained crates only in the workspace by default; keep
# checking every dependency.
unmaintained = "all"
ignore = [
    # Temporär für ksni 0.3.7 (zieht zbus 5.19.0 transitiv); siehe docs/spec/questions.md (M0-S07 Option A).
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # libbzip2 licence (BSD-style, GPL-compatible), from libbz2-rs-sys through bzip2
    "bzip2-1.0.6",
    "GPL-3.0-or-later",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.clarify]]
name = "cxx-kde-frameworks"
expression = "MPL-2.0"
license-files = [
    { path = "LICENSES/MPL-2.0.txt", hash = 0x00000000 },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://invent.kde.org/libraries/cxx-kde-frameworks.git"]
