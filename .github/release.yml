# Groups GitHub's generated release notes (pull requests since the previous tag) by label.
# .github/workflows/release.yml appends them below the highlights and stories of a release.
# A pull request lands in the first category whose labels it carries.

changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Accessibility
      labels: [accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies, github_actions]
    - title: Other changes
      labels: ["*"]
