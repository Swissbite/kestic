name: Security

on:
  push:
    branches: [main, "m*"]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 05:30 UTC to catch newly published RustSec advisories on main.
    - cron: "30 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (PR Diff)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run GitHub Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          allow-licenses: |
            Apache-2.0
            BSD-2-Clause
            BSD-3-Clause
            GPL-3.0-or-later
            ISC
            MIT
            MPL-2.0
            Unicode-3.0
            Unlicense
            Zlib

  cargo-deny:
    name: RustSec & License Audit (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
