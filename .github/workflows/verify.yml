name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "m[0-9]", "m[0-9][0-9]"]
  workflow_dispatch:
  # After the weekly CI image rebuild on main (ci-image.yml): builds the cache
  # of the new week, so the first pull request of the week starts warm.
  workflow_run:
    workflows: [CI image]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# `just verify` split into jobs that run in parallel; each calls the same just
# recipe as `just verify` (via .github/scripts/ci-just.sh, as user `kesticci`):
#   scope      which jobs the run needs (.github/scripts/ci-scope.sh): a pull
#              request that changes only documentation or the site skips the
#              jobs that build and test, one that changes only the specification
#              runs spec-tests instead; every other event runs everything
#   ci-image   finds or builds the CI image all other jobs run in
#   checks     `_static-checks`: fmt, file sizes, cargo deny, reuse lint
#   clippy     `_clippy`: clippy without and with the test harness
#   build      `_build-test-harness`, then `_nextest-archive` for the test jobs
#   release    `deb`: release build and .deb
#   test       `_nextest-from-archive` in parts by nextest test group; the part
#              with `screenshot` also runs `_smoke-run` (the screenshot of `just smoke`)
#   deb-check  `_nextest-from-archive` for the tests on the built .deb
#   spec-tests `_spec-tests`: the tests that read docs/spec/, for spec-only pull requests
#   verify     the required check: green only when every job the scope needs
#              succeeded and no other job failed
jobs:
  # Runs outside the CI image: it only compares the merge commit of a pull
  # request with its first parent, the base branch.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      clippy: ${{ steps.scope.outputs.clippy }}
      build: ${{ steps.scope.outputs.build }}
      release: ${{ steps.scope.outputs.release }}
      test: ${{ steps.scope.outputs.test }}
      deb-check: ${{ steps.scope.outputs.deb-check }}
      spec-tests: ${{ steps.scope.outputs.spec-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: .github/scripts/ci-scope.sh outputs "$EVENT_NAME" >> "$GITHUB_OUTPUT"

  # Prebuilt image with base tools, en_US.UTF-8 locale, user `kesticci` and all
  # apt packages from bootstrap.sh; tagged by content hash of
  # .github/ci-image/Dockerfile + scripts/bootstrap.sh (built only if missing).
  # After a workflow_run it only finds the image the CI image workflow built.
  ci-image:
    name: CI image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  # Defines the YAML anchors `image-permissions` and `image` that the other jobs
  # in the CI image reuse.
  checks:
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: &image-permissions
      contents: read
      packages: read
    container: &image
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - run: .github/scripts/ci-just.sh _static-checks

  # Defines the YAML anchors `build-cache-paths` (same list as the restore step
  # in .github/actions/kestic-setup) and `drop-workspace-units`, reused below.
  clippy:
    needs: [ci-image, scope]
    if: needs.scope.outputs.clippy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: clippy
      - run: .github/scripts/ci-just.sh _clippy
      - name: Drop workspace build artifacts before caching
        if: steps.setup.outputs.build-cache-hit != 'true'
        # Only dependencies are cached; the workspace's own build units are
        # rebuilt on every commit anyway.
        run: &drop-workspace-units |
          rm -rf target/debug/build/kestic-* target/release/build/kestic-* \
            target/debug/kestic target/release/kestic \
            target/debian target/kestic-gui target/nextest-archive.tar.zst
          du -sh target
      - name: Save build cache
        if: steps.setup.outputs.build-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: &build-cache-paths |
            /home/kesticci/.cargo/registry/index
            /home/kesticci/.cargo/registry/cache
            /home/kesticci/.cargo/git/db
            target
          key: ${{ steps.setup.outputs.build-cache-key }}

  build:
    needs: [ci-image, scope]
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: dev
          # Only this job saves the toolchain and dev tools.
          save-tools-cache: "true"
      - run: .github/scripts/ci-just.sh _build-test-harness
      - run: .github/scripts/ci-just.sh _nextest-archive target/nextest-archive.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0
          overwrite: true
          if-no-files-found: error
      - name: Drop workspace build artifacts before caching
        if: steps.setup.outputs.build-cache-hit != 'true'
        run: *drop-workspace-units
      - name: Save build cache
        if: steps.setup.outputs.build-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *build-cache-paths
          key: ${{ steps.setup.outputs.build-cache-key }}

  release:
    needs: [ci-image, scope]
    if: needs.scope.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: release
      - run: rm -rf target/debian
      - run: .github/scripts/ci-just.sh deb
      - uses: actions/upload-artifact@v7
        with:
          name: kestic-deb
          path: target/debian/*.deb
          overwrite: true
          if-no-files-found: error
      - name: Drop workspace build artifacts before caching
        if: steps.setup.outputs.build-cache-hit != 'true'
        run: *drop-workspace-units
      - name: Save build cache
        if: steps.setup.outputs.build-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *build-cache-paths
          key: ${{ steps.setup.outputs.build-cache-key }}

  # Parts by nextest test group (.config/nextest.toml); the two large groups are
  # split in halves (`--partition count`). `unit` takes every test outside both
  # groups, so a new test always runs somewhere; deb-check takes the .deb tests.
  test:
    name: test (${{ matrix.part }})
    needs: [ci-image, scope, build]
    if: needs.scope.outputs.test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: *image-permissions
    container: *image
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixtures first (kestic-test-support): a broken restic template fails
          # once, clearly. The integration parts therefore leave them out.
          - part: unit
            first: package(kestic-test-support)
            filter: not (group(gui-smoke) | group(heavy-integration) | binary(m0_s05_deb_packaging))
          - part: integration-1
            filter: group(heavy-integration) & not package(kestic-test-support)
            partition: count:1/2
          - part: integration-2
            filter: group(heavy-integration) & not package(kestic-test-support)
            partition: count:2/2
          - part: gui-1
            filter: group(gui-smoke)
            partition: count:1/2
            screenshot: true
          - part: gui-2
            filter: group(gui-smoke)
            partition: count:2/2
    env:
      ARCHIVE_NAME: nextest/nextest-archive.tar.zst
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest
      - run: chmod a+r "$RUNNER_TEMP/$ARCHIVE_NAME"
      - name: Fixture tests
        if: matrix.first
        run: .github/scripts/ci-just.sh _nextest-from-archive "$RUNNER_TEMP/$ARCHIVE_NAME" "${{ matrix.first }}"
      - name: Tests (${{ matrix.part }})
        run: .github/scripts/ci-just.sh _nextest-from-archive "$RUNNER_TEMP/$ARCHIVE_NAME" "${{ matrix.filter }}" "${{ matrix.partition }}"
      - name: Smoke screenshot of the main window
        if: matrix.screenshot
        run: .github/scripts/ci-just.sh _smoke-run
      - name: Upload GUI smoke screenshots
        if: always() && startsWith(matrix.part, 'gui')
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.part }}
          path: target/smoke-artifacts/*.png
          overwrite: true
          if-no-files-found: error

  deb-check:
    needs: [ci-image, scope, build, release]
    if: needs.scope.outputs.deb-check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: *image-permissions
    container: *image
    env:
      ARCHIVE_NAME: nextest/nextest-archive.tar.zst
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest
      - uses: actions/download-artifact@v8
        with:
          name: kestic-deb
          path: target/debian
      - run: chmod a+r "$RUNNER_TEMP/$ARCHIVE_NAME" && chown -R kesticci:kesticci target
      - run: .github/scripts/ci-just.sh _nextest-from-archive "$RUNNER_TEMP/$ARCHIVE_NAME" 'binary(m0_s05_deb_packaging)'

  # The tests that read the specification (ci-scope.sh spec-tests), built on
  # their own, for a pull request that changes docs/spec/ but no code.
  spec-tests:
    needs: [ci-image, scope]
    if: needs.scope.outputs.spec-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
        with:
          build-cache: dev
      - run: .github/scripts/ci-just.sh _spec-tests

  # The required check. A failed or cancelled job counts as failed, and so does
  # a skipped job that the scope needs (ci-scope.sh verdict).
  verify:
    if: always()
    needs: [ci-image, scope, checks, clippy, build, release, test, deb-check, spec-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # One artifact with all screenshots, as pages.yml expects. Download and
      # upload again (instead of merging) so that re-running failed jobs works.
      - name: Download GUI smoke screenshots
        if: needs.test.result != 'skipped'
        uses: actions/download-artifact@v8
        with:
          pattern: smoke-artifacts-*
          merge-multiple: true
          path: smoke-artifacts
      - name: Upload all GUI smoke screenshots
        if: needs.test.result != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: smoke-artifacts/*.png
          overwrite: true
          if-no-files-found: error
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          SCOPE: ${{ needs.scope.outputs.scope }}
        run: |
          set -o pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' |
            .github/scripts/ci-scope.sh verdict "$SCOPE"
