name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Prebuilt image with base tools, en_US.UTF-8 locale, user `kesticci` and all
  # apt packages from bootstrap.sh; tagged by content hash of
  # .github/ci-image/Dockerfile + scripts/bootstrap.sh (built only if missing).
  ci-image:
    name: CI image
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  verify:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare non-root CI user directories
        run: |
          mkdir -p /home/kesticci/.cargo /home/kesticci/.rustup /home/kesticci/.local/share/kestic-dev
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"

      - name: Cache Cargo, Rust toolchain, dev tools, and target
        uses: actions/cache@v6
        with:
          path: |
            /home/kesticci/.cargo/bin
            /home/kesticci/.cargo/registry/index
            /home/kesticci/.cargo/registry/cache
            /home/kesticci/.cargo/git/db
            /home/kesticci/.rustup
            /home/kesticci/.local/share/kestic-dev
            target
          # v2: fresh start without the old multi-GB caches. No fallback across
          # Cargo.lock changes: restoring an older cache would carry stale
          # dependency builds forward, and cargo never deletes them.
          key: ${{ runner.os }}-kestic-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ hashFiles('scripts/bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-kestic-v2-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-

      - name: Fix cache ownership and clear stale build artifacts
        run: |
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"
          rm -rf target/debian target/smoke-artifacts

      - name: Bootstrap Rust toolchain and restic test binaries
        env:
          KESTIC_BOOTSTRAP_SKIP_APT: "1"
          KESTIC_BOOTSTRAP_COMPONENTS: rust,restic-0.18.0,restic-latest,rest-server,rclone
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            KESTIC_BOOTSTRAP_SKIP_APT=1 \
            KESTIC_BOOTSTRAP_COMPONENTS=rust,restic-0.18.0,restic-latest,rest-server,rclone \
            ./scripts/bootstrap.sh
          "

      - name: Run just verify as non-root user
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"
            export LANG=en_US.UTF-8
            export NEXTEST_PROFILE=ci
            # Keep the cached target small: no incremental state (useless in a
            # fresh CI checkout) and only line tables instead of full debuginfo
            # (backtraces keep file:line).
            export CARGO_INCREMENTAL=0
            export CARGO_PROFILE_DEV_DEBUG=line-tables-only
            just verify
          "

      - name: Upload Debian package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kestic-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: target/smoke-artifacts/*.png
          if-no-files-found: error

      # Runs before the cache post-step saves `target`: drop the workspace's own
      # build units (rebuilt on every commit anyway), so only dependencies are
      # cached.
      - name: Drop workspace build artifacts before caching
        if: always()
        run: |
          rm -rf target/debug/build/kestic-* target/release/build/kestic-* \
            target/debug/incremental target/release/incremental \
            target/debug/kestic target/release/kestic \
            target/debian target/smoke-artifacts target/kestic-gui \
            target/kestic-test-fixtures
          du -sh target || true
