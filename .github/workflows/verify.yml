name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # After the weekly CI image rebuild on main (ci-image.yml): builds the cache
  # of the new week, so the first pull request of the week starts warm.
  workflow_run:
    workflows: [CI image]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Prebuilt image with base tools, en_US.UTF-8 locale, user `kesticci` and all
  # apt packages from bootstrap.sh; tagged by content hash of
  # .github/ci-image/Dockerfile + scripts/bootstrap.sh (built only if missing).
  # After a workflow_run it only finds the image the CI image workflow built.
  ci-image:
    name: CI image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  verify:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Each cache is restored and saved in separate steps; both use these lists.
    env:
      TOOLS_CACHE_PATHS: |
        /home/kesticci/.cargo/bin
        /home/kesticci/.rustup
        /home/kesticci/.local/share/kestic-dev
      BUILD_CACHE_PATHS: |
        /home/kesticci/.cargo/registry/index
        /home/kesticci/.cargo/registry/cache
        /home/kesticci/.cargo/git/db
        target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare non-root CI user directories
        run: |
          mkdir -p /home/kesticci/.cargo /home/kesticci/.rustup /home/kesticci/.local/share/kestic-dev
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"

      # The toolchain and dev tools depend only on rust-toolchain.toml and
      # bootstrap.sh, so a Cargo.lock change does not reinstall them.
      - name: Restore Rust toolchain and dev tools
        id: tools-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.TOOLS_CACHE_PATHS }}
          key: ${{ runner.os }}-kestic-tools-v1-${{ hashFiles('rust-toolchain.toml', 'scripts/bootstrap.sh') }}

      # Build artifacts: a Cargo.lock change falls back to the newest cache of the
      # same ISO week and toolchain and rebuilds only the changed crates. Cargo
      # never deletes the replaced builds, so the key starts afresh every week
      # (by the calendar, independent of the CI image) and the cache cannot grow
      # without bound.
      - name: Compute build cache key prefix
        id: build-key
        run: echo "prefix=${{ runner.os }}-kestic-build-v1-$(date -u +%G-W%V)-${{ hashFiles('rust-toolchain.toml') }}-" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo registry and build artifacts
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-key.outputs.prefix }}${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ steps.build-key.outputs.prefix }}

      - name: Fix cache ownership and clear stale build artifacts
        run: |
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"
          rm -rf target/debian target/smoke-artifacts

      - name: Bootstrap Rust toolchain and restic test binaries
        env:
          KESTIC_BOOTSTRAP_SKIP_APT: "1"
          KESTIC_BOOTSTRAP_COMPONENTS: rust,restic-0.18.0,restic-latest,rest-server,rclone
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            KESTIC_BOOTSTRAP_SKIP_APT=1 \
            KESTIC_BOOTSTRAP_COMPONENTS=rust,restic-0.18.0,restic-latest,rest-server,rclone \
            ./scripts/bootstrap.sh
          "

      - name: Save Rust toolchain and dev tools
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.TOOLS_CACHE_PATHS }}
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}

      # The log shows the cache steps below how far `just verify` got.
      - name: Run just verify as non-root user
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"
            export LANG=en_US.UTF-8
            export NEXTEST_PROFILE=ci
            # No incremental state: useless in a fresh CI checkout, and it would
            # only bloat the cached target.
            export CARGO_INCREMENTAL=0
            mkdir -p target
            just verify 2>&1 | tee target/verify.log
          "

      - name: Upload Debian package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kestic-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: target/smoke-artifacts/*.png
          if-no-files-found: error

      # The build cache is saved even when a test failed, as long as every build
      # finished: otherwise one failing test on main leaves the following pull
      # requests without a cache. `just` prints each line of `verify` before
      # running it and stops at the first failing one; `just _smoke-run` comes
      # right after the last build (`just _build-test-harness`).
      - name: Check that all builds of just verify finished
        id: builds
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        run: |
          if grep -qx 'just _smoke-run' target/verify.log 2>/dev/null; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "::warning::just verify stopped before its last build; the build cache is not saved."
          fi

      # Only dependencies are cached; the workspace's own build units are rebuilt
      # on every commit anyway.
      - name: Drop workspace build artifacts before caching
        if: always() && steps.builds.outputs.complete == 'true'
        run: |
          rm -rf target/debug/build/kestic-* target/release/build/kestic-* \
            target/debug/incremental target/release/incremental \
            target/debug/kestic target/release/kestic \
            target/debian target/smoke-artifacts target/kestic-gui \
            target/kestic-test-fixtures target/verify.log
          du -sh target

      - name: Save Cargo registry and build artifacts
        if: always() && steps.builds.outputs.complete == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.BUILD_CACHE_PATHS }}
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
