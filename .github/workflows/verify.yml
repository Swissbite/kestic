name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # After the weekly CI image rebuild on main (ci-image.yml): builds the cache
  # of the new week, so the first pull request of the week starts warm.
  workflow_run:
    workflows: [CI image]
    types: [completed]
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# `just verify` split into jobs that run in parallel; `verify` at the end is the
# one check that branch protection requires. Mapping:
#   checks     fmt, file sizes, reuse lint, cargo deny
#   clippy     both clippy runs (plain and with the test harness)
#   build      test-harness `kestic` and all test binaries, packed as a nextest archive
#   release    `just deb` (release build and .deb)
#   test       every other test from the archive, in parts; `gui-1` also takes the
#              smoke screenshot of `just smoke`
#   deb-check  the tests on the built .deb
#
# Jobs in the CI image run their commands as user `kesticci` (`su - kesticci`),
# because the tests must not run as root.
jobs:
  # Prebuilt image with base tools, en_US.UTF-8 locale, user `kesticci` and all
  # apt packages from bootstrap.sh; tagged by content hash of
  # .github/ci-image/Dockerfile + scripts/bootstrap.sh (built only if missing).
  # After a workflow_run it only finds the image the CI image workflow built.
  ci-image:
    name: CI image
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  checks:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions: &image-permissions
      contents: read
      packages: read
    container: &image
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - name: fmt, file sizes, reuse lint, cargo deny
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8
            cargo fmt --all -- --check
            just _check-file-sizes
            reuse lint
            cargo deny check
          "

  clippy:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: clippy
      - id: clippy
        name: clippy
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8 CARGO_INCREMENTAL=0
            cargo clippy --workspace --all-targets -- -D warnings
            cargo clippy --workspace --all-targets --features kestic-gui/test-harness -- -D warnings
          "
      # A lint finding leaves every dependency checked, so the cache is complete.
      - name: Save build cache
        if: always() && steps.setup.outputs.build-cache-hit != 'true' && (steps.clippy.outcome == 'success' || steps.clippy.outcome == 'failure')
        uses: actions/cache/save@v6
        with:
          path: &build-cache-paths |
            /home/kesticci/.cargo/registry/index
            /home/kesticci/.cargo/registry/cache
            /home/kesticci/.cargo/git/db
            target
          key: ${{ steps.setup.outputs.build-cache-key }}

  build:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: dev
          save-tools-cache: "true"
      - name: Build the test-harness kestic and all test binaries
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8 CARGO_INCREMENTAL=0
            just _build-test-harness
            cargo nextest archive --workspace --features kestic-gui/test-harness \
              --archive-file target/nextest-archive.tar.zst
          "
      - uses: actions/upload-artifact@v7
        with:
          name: nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      # Only dependencies are cached; the workspace's own build units are rebuilt
      # on every commit anyway.
      - name: Drop workspace build artifacts before caching
        if: steps.setup.outputs.build-cache-hit != 'true'
        run: &drop-workspace-units |
          rm -rf target/debug/build/kestic-* target/release/build/kestic-* \
            target/debug/kestic target/release/kestic \
            target/debian target/kestic-gui target/nextest-archive.tar.zst
          du -sh target
      - name: Save build cache
        if: steps.setup.outputs.build-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *build-cache-paths
          key: ${{ steps.setup.outputs.build-cache-key }}

  release:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/kestic-setup
        with:
          build-cache: release
      - name: Release build and .deb
        run: |
          rm -rf target/debian
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8 CARGO_INCREMENTAL=0
            just deb
          "
      - uses: actions/upload-artifact@v7
        with:
          name: kestic-deb
          path: target/debian/*.deb
          if-no-files-found: error
      - name: Drop workspace build artifacts before caching
        if: steps.setup.outputs.build-cache-hit != 'true'
        run: *drop-workspace-units
      - name: Save build cache
        if: steps.setup.outputs.build-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: *build-cache-paths
          key: ${{ steps.setup.outputs.build-cache-key }}

  # Parts by nextest test group; the two large groups are split in halves
  # (`--partition count`). Together the parts and deb-check cover every test.
  test:
    name: test (${{ matrix.part }})
    needs: [ci-image, build]
    runs-on: ubuntu-latest
    permissions: *image-permissions
    container: *image
    strategy:
      fail-fast: false
      matrix:
        include:
          # Fixtures first: a broken restic template fails once, clearly.
          - part: unit
            first: package(kestic-test-support)
            filter: not (group(gui-smoke) | group(heavy-integration) | binary(m0_s05_deb_packaging))
          - part: integration-1
            filter: group(heavy-integration) & not package(kestic-test-support)
            partition: count:1/2
          - part: integration-2
            filter: group(heavy-integration) & not package(kestic-test-support)
            partition: count:2/2
          - part: gui-1
            filter: group(gui-smoke)
            partition: count:1/2
            smoke: true
          - part: gui-2
            filter: group(gui-smoke)
            partition: count:2/2
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest
      - name: Tests (${{ matrix.part }})
        env:
          ARCHIVE: ${{ runner.temp }}/nextest/nextest-archive.tar.zst
          FIRST: ${{ matrix.first }}
          FILTER: ${{ matrix.filter }}
          PARTITION: ${{ matrix.partition }}
        run: |
          chmod a+r "$ARCHIVE"
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8 NEXTEST_PROFILE=ci
            run() {
              cargo nextest run --archive-file '$ARCHIVE' --workspace-remap . \
                --extract-to . --extract-overwrite \"\$@\"
            }
            if [ -n '$FIRST' ]; then run -E '$FIRST'; fi
            run -E '$FILTER' ${PARTITION:+--partition $PARTITION}
          "
      - name: Smoke screenshot of the main window
        if: matrix.smoke
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"
            just _smoke-run
          "
      - name: Upload GUI smoke screenshots
        if: always() && startsWith(matrix.part, 'gui')
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts-${{ matrix.part }}
          path: target/smoke-artifacts/*.png
          if-no-files-found: error

  deb-check:
    needs: [ci-image, build, release]
    runs-on: ubuntu-latest
    permissions: *image-permissions
    container: *image
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kestic-setup
      - uses: actions/download-artifact@v8
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest
      - uses: actions/download-artifact@v8
        with:
          name: kestic-deb
          path: target/debian
      - name: Tests on the .deb
        env:
          ARCHIVE: ${{ runner.temp }}/nextest/nextest-archive.tar.zst
        run: |
          chmod a+r "$ARCHIVE"
          chown -R kesticci:kesticci target
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\" LANG=en_US.UTF-8 NEXTEST_PROFILE=ci
            cargo nextest run --archive-file '$ARCHIVE' --workspace-remap . \
              --extract-to . --extract-overwrite -E 'binary(m0_s05_deb_packaging)'
          "

  # The required check: green only when every job above succeeded. A skipped or
  # cancelled job counts as failed.
  verify:
    if: always()
    needs: [ci-image, checks, clippy, build, release, test, deb-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # One artifact with all screenshots, as pages.yml expects.
      - name: Merge GUI smoke screenshots
        if: needs.test.result != 'skipped'
        uses: actions/upload-artifact/merge@v7
        with:
          name: smoke-artifacts
          pattern: smoke-artifacts-*
          delete-merged: true
      - name: All jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
