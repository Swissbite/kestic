name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Prebuilt image with base tools, en_US.UTF-8 locale, user `kesticci` and all
  # apt packages from bootstrap.sh; tagged by content hash of
  # .github/ci-image/Dockerfile + scripts/bootstrap.sh (built only if missing).
  ci-image:
    name: CI image
    uses: ./.github/workflows/ci-image.yml
    permissions:
      contents: read
      packages: write

  verify:
    needs: ci-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.ci-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare non-root CI user directories
        run: |
          mkdir -p /home/kesticci/.cargo /home/kesticci/.rustup /home/kesticci/.local/share/kestic-dev
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"

      - name: Cache Cargo, Rust toolchain, dev tools, and target
        uses: actions/cache@v6
        with:
          path: |
            /home/kesticci/.cargo/bin
            /home/kesticci/.cargo/registry/index
            /home/kesticci/.cargo/registry/cache
            /home/kesticci/.cargo/git/db
            /home/kesticci/.rustup
            /home/kesticci/.local/share/kestic-dev
            target
          key: ${{ runner.os }}-kestic-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/bootstrap.sh') }}
          restore-keys: |
            ${{ runner.os }}-kestic-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            ${{ runner.os }}-kestic-

      - name: Fix cache ownership and clear stale build artifacts
        run: |
          chown -R kesticci:kesticci /home/kesticci "$GITHUB_WORKSPACE"
          rm -rf target/debian target/smoke-artifacts

      - name: Bootstrap Rust toolchain and restic test binaries
        env:
          KESTIC_BOOTSTRAP_SKIP_APT: "1"
          KESTIC_BOOTSTRAP_COMPONENTS: rust,restic-0.18.0,restic-latest,rest-server,rclone
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            KESTIC_BOOTSTRAP_SKIP_APT=1 \
            KESTIC_BOOTSTRAP_COMPONENTS=rust,restic-0.18.0,restic-latest,rest-server,rclone \
            ./scripts/bootstrap.sh
          "

      - name: Run just verify as non-root user
        run: |
          su - kesticci -c "
            set -euo pipefail
            cd '$GITHUB_WORKSPACE'
            export PATH=\"\$HOME/.cargo/bin:\$PATH\"
            export LANG=en_US.UTF-8
            export NEXTEST_PROFILE=ci
            just verify
          "

      - name: Upload Debian package artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kestic-deb
          path: target/debian/*.deb
          if-no-files-found: error

      - name: Upload GUI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-artifacts
          path: target/smoke-artifacts/*.png
          if-no-files-found: error
