# CodeQL advanced setup with the default setup's languages, query suite and
# weekly schedule, plus the showcase site's TypeScript. Tests generate their
# passwords at runtime, so every rule also covers test code.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers the TypeScript of the showcase site (site/).
        language: [actions, c-cpp, javascript-typescript, rust]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Site dependencies and build output are never analysed (they only
          # exist after a local `pnpm install` / `just site`).
          config: |
            paths-ignore:
              - site/node_modules
              - site/dist

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
