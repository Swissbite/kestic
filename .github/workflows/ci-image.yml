# Builds the CI container image (.github/ci-image/Dockerfile) and pushes it to
# GHCR, tagged with a content hash of the Dockerfile and scripts/bootstrap.sh
# (same formula as .github/ci-image/tag.sh).
#
# The job's token may push to GHCR, and on pull requests and integration
# branches the checkout is code the maintainer has not reviewed yet. So no step
# executes a file from the checkout: the tag is computed inline, the checkout
# keeps no credentials, and the Dockerfile only runs inside `docker build`,
# which sees neither the token nor the runner's files outside `scripts/`.
#
# verify.yml calls this workflow as its first job (workflow_call). If an image
# with the matching tag already exists, the job only checks the registry
# (~15 s) and returns the reference; otherwise it builds and pushes the image
# once. This avoids a race between a separate path-triggered build and the
# verify run of the same commit.
#
# Keeping the image current: every Monday the schedule rebuilds and overwrites
# the main tag (`force`), so Ubuntu security updates arrive within a week even
# if bootstrap.sh does not change. The previous version becomes untagged and is
# removed by ci-image-cleanup.yml. PR/branch tags are rebuilt from scratch at
# the latest after 10 days because the cleanup deletes them. Manual dispatch
# with `force` does the same on demand, and release.yml forces a rebuild for
# every release.

name: CI image

on:
  workflow_call:
    inputs:
      force:
        description: Rebuild and overwrite the tag even if it already exists.
        type: boolean
        default: false
    outputs:
      image:
        description: Fully qualified reference of the CI image matching the current bootstrap inputs.
        value: ${{ jobs.ensure.outputs.image }}
  schedule:
    # Every Monday at 03:00 UTC (before ci-image-cleanup.yml at 04:00).
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and overwrite the tag even if it already exists (e.g. to pick up Ubuntu security updates).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ensure:
    name: Ensure CI image
    runs-on: ubuntu-latest
    # A full image build takes well under this; a hang should not hold a runner for 6 h.
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Inline instead of calling tag.sh: a script from the checkout would run
      # with this job's token. Keep the formula in sync with tag.sh, which
      # ci-image-cleanup.yml uses to find the tags still in use.
      - name: Compute image reference
        id: ref
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          tag="$(sha256sum -- .github/ci-image/Dockerfile scripts/bootstrap.sh | sha256sum | cut -c1-16)"
          # GHCR requires lowercase repository names.
          image="ghcr.io/${OWNER,,}/kestic-ci:$tag"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "CI image: $image"

      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Check for existing image
        id: exists
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          FORCE: ${{ inputs.force || github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          if [[ "$FORCE" != "true" ]] && docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "[ok] $IMAGE already exists"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "[build] $IMAGE will be built"
          fi

      - name: Build and push image
        if: steps.exists.outputs.found != 'true'
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker build \
            --pull \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.description=Kestic CI image (Ubuntu 26.04 + bootstrap.sh apt packages)" \
            --file .github/ci-image/Dockerfile \
            --tag "$IMAGE" \
            scripts
          if ! docker push "$IMAGE"; then
            echo "::error::Could not push $IMAGE. Pull requests from forks have a read-only token; a maintainer has to run the 'CI image' workflow (workflow_dispatch) on a branch with the same Dockerfile/bootstrap.sh first."
            exit 1
          fi
