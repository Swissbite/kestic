[package]
name = "kestic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kestic-i18n = { path = "../i18n" }
getrandom = "0.4"
jiff.workspace = true
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shlex = "2.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1.2"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
url = "2.5"
which = "8.0"

[dev-dependencies]
tempfile = "3.27"
kestic-test-support = { path = "../test-support" }

[lints]
workspace = true
