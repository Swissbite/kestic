[package]
name = "kestic-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kestic-i18n = { path = "../i18n" }
bzip2 = "0.6.1"
getrandom = "0.4"
jiff.workspace = true
rustix = { version = "1.1", features = ["fs", "process"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shlex = "2.0"
thiserror = "2.0"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
toml = "1.2"
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }
url = "2.5"
which = "8.0"

[features]
# Lets tests replace the release URL, the embedded signing key and its fingerprint
# (`KESTIC_TEST_RELEASE_URL`, `KESTIC_TEST_SIGNING_KEY`, `KESTIC_TEST_SIGNING_FPR`) and reach a
# release mock over plain HTTP on 127.0.0.1; never enabled for the .deb.
test-trust-anchor = []

[dev-dependencies]
kestic-core = { path = ".", features = ["test-trust-anchor"] }
tempfile = "3.27"
kestic-test-support = { path = "../test-support" }

[lints]
workspace = true
