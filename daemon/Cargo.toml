[package]
name = "kestic-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
kestic-core = { path = "../core" }
kestic-i18n = { path = "../i18n" }
ksni = { workspace = true }
notify-rust = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.4"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
zbus = { workspace = true }

[build-dependencies]
kestic-build-stamp = { path = "../build-stamp" }

[dev-dependencies]
kestic-build-stamp = { path = "../build-stamp" }
kestic-core = { path = "../core", features = ["test-trust-anchor"] }
tempfile = "3.27"
kestic-test-support = { path = "../test-support" }

[lints]
workspace = true
